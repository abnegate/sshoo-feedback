name: Bug report
description: Something in SSHoo doesn't work as it should.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Issues are public: **don't include hostnames, IP addresses, usernames, keys, passwords, tokens or unredacted logs.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a host
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Connecting or authentication
        - Terminal
        - tmux
        - SFTP
        - Tunnels (port forwarding)
        - Claude Code or Codex chat
        - Voice mode
        - Tailscale discovery
        - Pro, trial or purchase
        - Settings, backup or app lock
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SSHoo version
      description: Settings, Version.
      placeholder: e.g. 1.4.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Pixel 9, Android 16
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server
      description: Server OS and SSH server, if the bug involves a connection. No hostnames.
      placeholder: e.g. Ubuntu 24.04, OpenSSH 9.6, key authentication
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Redact anything private before posting.
